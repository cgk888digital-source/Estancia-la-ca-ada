<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A65D47" />
    <meta name="description" content="Reservas, restaurante y excursiones de Estancia La Cañada" />

    <!-- iOS no lee el manifest: necesita sus propias etiquetas para el icono y el modo app -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Cañada" />

    <title>Estancia La Cañada</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force clear old PWA caches so new deployments load instantly
      if ('serviceWorker' in navigator) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf('workbox-precache') !== -1) {
              caches.delete(names[i]);
            }
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
